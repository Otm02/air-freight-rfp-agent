name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Python 3.12 (for openpyxl parity check)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python openpyxl
        run: python3 -m pip install --no-cache-dir openpyxl

      - name: Install dependencies
        run: npm ci

      - name: Scan for leaked secrets
        run: npm run check:secrets

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit & edge-case tests
        run: npm test

      - name: Run offline intake & pricing evaluations
        run: npm run eval

      - name: Build Next.js production bundle
        run: npm run build
        env:
          LLM_PROVIDER: offline
          DATABASE_URL: file:./data/ci-build.db

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E walkthrough
        run: rm -f data/e2e-test.db* && npm run e2e
        env:
          LLM_PROVIDER: offline
          DATABASE_URL: file:./data/e2e-test.db
